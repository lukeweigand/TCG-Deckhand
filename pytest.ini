[pytest]
# Pytest configuration for TCG Deckhand

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for workflows
    ui: Tests for UI components (require Tkinter)
    db: Tests that use database
    ai: Tests for AI components
    slow: Tests that take longer to run
    manual: Tests requiring manual verification

# Test paths
testpaths = tests

# Coverage options
[coverage:run]
source = src
omit = 
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
